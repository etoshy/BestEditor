<script>

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

for(let i=0;i<(SIM?26:0);i++){const d=document.createElement('div');d.className='suit';d.textContent=[...SIM][i%[...SIM].length];d.style.fontSize=(60+R(i)*110)+'px';SU.appendChild(d);suits.push(d)}
const CB=$('#chbar'); CFG.CH.forEach(()=>{const d=document.createElement('div');d.appendChild(document.createElement('i'));CB.appendChild(d)});

  seen:$$('[data-seen]',s),tcl:$$('[data-tcls]',s),ifr:s.querySelector('iframe.hand'),

  suits.forEach((d,i)=>{const x=(R(i+3)*2100+t*(8+R(i+9)*14))%2100-90, y=(R(i+7)*1200+Math.sin(t*.3+i)*40-t*(4+R(i)*6))%1200; d.style.transform=`translate(${x}px,${(y+1200)%1200-60}px) rotate(${t*(R(i)*20-10)}deg)`});
