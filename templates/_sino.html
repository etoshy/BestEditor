<!-- 🔔 sininho de notificações (em todas as páginas) — ver notificacoes.py -->
<style data-ui-base>
  #sinoBox { position: fixed; top: 10px; right: 12px; z-index: 99999; font-family: var(--fonte, -apple-system, Segoe UI, Roboto, sans-serif); }
  .app-topo #sinoBox { position: relative; top: auto; right: auto; z-index: auto; }
  #sinoBtn { position: relative; width: 40px; height: 40px; margin: 0; padding: 0; border-radius: 50%; border: 1px solid var(--borda, #ddd);
    background: var(--card, #fff); color: var(--texto, #222); font-size: 16px; line-height: 38px; cursor: pointer; box-shadow: var(--sombra, 0 1px 4px rgba(0,0,0,.15));
    display: inline-flex; align-items: center; justify-content: center; }
  #sinoBtn:hover { background: var(--card-2, #f3f4f6); filter: none; }
  #sinoNum { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box;
    border-radius: 9px; background: #dc2626; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; display: none; }
  #sinoLista { display: none; position: absolute; right: 0; top: 48px; width: min(380px, calc(100vw - 24px)); max-height: 72vh; overflow: auto;
    background: var(--card, #fff); color: var(--texto, #222); border: 1px solid var(--borda, #ddd); border-radius: 12px; box-shadow: var(--sombra-alta, 0 8px 24px rgba(0,0,0,.18)); text-align: left; }
  #sinoLista.aberta { display: block; }
  #sinoLista .sTopo { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--borda, #eee);
    position: sticky; top: 0; background: var(--card, #fff); font-weight: 700; font-size: 14px; font-family: var(--fonte-titulo, inherit); }
  #sinoLista .sTopo a { font-weight: 500; font-size: 12px; color: var(--link, #2563eb); cursor: pointer; margin-left: 10px; text-decoration: none; }
  #sinoLista .sItem { display: block; padding: 9px 14px; border-bottom: 1px solid var(--borda, #f1f1f1); color: inherit; text-decoration: none; font-size: 13px; }
  #sinoLista .sItem:hover { background: var(--bg-2, #f5f7ff); }
  #sinoLista .sItem.nova { background: var(--acento-suave, #eff6ff); }
  #sinoLista .sItem b { display: block; font-weight: 600; }
  #sinoLista .sItem .sMsg { color: var(--texto-2, #555); font-size: 12px; white-space: pre-wrap; max-height: 3.6em; overflow: hidden; }
  #sinoLista .sItem .sQuando { color: var(--mudo, #888); font-size: 11px; }
  #sinoLista .sItem.erro b { color: var(--erro, #b91c1c); } #sinoLista .sItem.aviso b { color: var(--aviso, #a16207); }
  #sinoLista .sVazio { padding: 18px 12px; color: var(--mudo, #777); font-size: 13px; text-align: center; }
  #sinoToast { position: fixed; right: 12px; top: 70px; z-index: 99999; max-width: 340px; display: none; background: #111827; color: #fff;
    padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
</style>
<div id="sinoBox">
  <button type="button" id="sinoBtn" title="Notificações" aria-label="Notificações"><i class="fa-solid fa-bell"></i><span id="sinoNum"></span></button>
  <div id="sinoLista" role="menu">
    <div class="sTopo"><span>Notificações</span><span><a id="sinoLer">marcar todas como lidas</a><a href="/historico"><i class="fa-solid fa-clock-rotate-left"></i> histórico</a></span></div>
    <div id="sinoItens"><div class="sVazio">Carregando…</div></div>
  </div>
</div>
<div id="sinoToast"></div>
<script>
(function () {
  const btn = document.getElementById('sinoBtn'), num = document.getElementById('sinoNum'), lista = document.getElementById('sinoLista'),
        itensEl = document.getElementById('sinoItens'), toast = document.getElementById('sinoToast');
  const tituloOrig = document.title;
  let vistos = null, ultimo = [];
  const esc = (s) => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function quando(t, agora) {
    const s = Math.max(0, (agora || Date.now() / 1000) - t);
    if (s < 60) return 'agora'; if (s < 3600) return Math.floor(s / 60) + ' min atrás'; if (s < 86400) return Math.floor(s / 3600) + ' h atrás';
    return new Date(t * 1000).toLocaleString('pt-BR');
  }
  function desenhar(d) {
    ultimo = d.itens || [];
    const n = d.nao_lidas || 0;
    num.textContent = n > 99 ? '99+' : n; num.style.display = n ? 'block' : 'none';
    document.title = (n ? '(' + n + ') ' : '') + tituloOrig;
    itensEl.innerHTML = ultimo.length ? ultimo.map(x =>
      '<a class="sItem ' + esc(x.nivel) + (x.lida ? '' : ' nova') + '" href="/notificacoes/ir/' + esc(x.id) + '">' +
      '<b>' + esc(x.titulo) + '</b>' + (x.msg ? '<div class="sMsg">' + esc(x.msg) + '</div>' : '') +
      '<span class="sQuando">' + quando(x.quando, d.agora) + '</span></a>').join('')
      : '<div class="sVazio">Nada por aqui ainda. Quando algo ficar pronto (ou precisar de você) aparece aqui.</div>';
    const novos = ultimo.filter(x => !x.lida && vistos && !vistos.has(x.id + ':' + x.quando));
    if (novos.length) {
      toast.innerHTML = '🔔 <b>' + esc(novos[0].titulo) + '</b>' + (novos.length > 1 ? ' <span style="opacity:.7">(+' + (novos.length - 1) + ')</span>' : '');
      toast.onclick = () => { location.href = '/notificacoes/ir/' + novos[0].id; };
      toast.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { toast.style.display = 'none'; }, 7000);
    }
    vistos = new Set(ultimo.map(x => x.id + ':' + x.quando));
  }
  async function buscar() {
    try { const r = await fetch('/notificacoes', { cache: 'no-store' }); if (r.ok) desenhar(await r.json()); } catch (_) { /* site fechado */ }
  }
  btn.addEventListener('click', (e) => { e.stopPropagation(); lista.classList.toggle('aberta'); if (lista.classList.contains('aberta')) buscar(); });
  document.addEventListener('click', (e) => { if (!document.getElementById('sinoBox').contains(e.target)) lista.classList.remove('aberta'); });
  document.getElementById('sinoLer').addEventListener('click', async () => {
    await fetch('/notificacoes/lidas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
    buscar();
  });
  window.sinoAtualizar = buscar;
  buscar();
  setInterval(() => { if (!document.hidden) buscar(); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) buscar(); });
})();
</script>
