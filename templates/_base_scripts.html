  <script>
  // 🔄 v84_102: servidor rodando código velho (atualizou o site com ele aberto) → avisa em vez de deixar botão dar 404
  (function () {
    const ESPERADO = {{ (versao_codigo | default(''))|tojson }};
    const faixa = (txt) => {
      if (document.getElementById('avisoCodigoVelho')) return;
      const d = document.createElement('div'); d.id = 'avisoCodigoVelho';
      d.style.cssText = 'position:sticky;top:0;z-index:9999;background:#b91c1c;color:#fff;padding:10px 14px;font-size:.9rem;line-height:1.4';
      d.innerHTML = txt + ' <button type="button" style="margin-left:8px;width:auto;padding:2px 10px;background:#fff;color:#b91c1c" onclick="this.parentNode.remove()">ok</button>';
      document.body.prepend(d);
    };
    fetch('/versao-codigo', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => {
      if (!d || !ESPERADO || d.id !== ESPERADO)
        faixa('⚠ <b>O servidor do site está rodando um código ANTIGO</b> (você atualizou os arquivos, mas a janela do <code>python app.py</code> de antes continua aberta — ou tem duas abertas). Por isso alguns botões novos dão <b>404</b>. Feche <b>todas</b> as janelas do site e abra de novo.');
      else if (d.desatualizado)
        faixa('⚠ <b>Os arquivos do site mudaram depois que o servidor abriu</b> (' + (d.arquivos || []).slice(0, 5).join(', ') + '). Se o servidor não reiniciou sozinho, feche a janela do <code>python app.py</code> e abra de novo — senão os botões novos dão 404.');
    }).catch(() => {});
  })();
  </script>
  <script>
  // 🤖 botões "Gerar com a IA" (data-ia-gerar): gera o prompt, manda pra IA de /ia e lê a resposta.
  // ⏳ v84_87: a IA roda em SEGUNDO PLANO no servidor — pode fechar a aba. Quando terminar chega um aviso no 🔔
  // e, voltando nesta página, a resposta é colada e lida sozinha.
  (function () {
    const bots = document.querySelectorAll('[data-ia-gerar]');
    if (!bots.length) return;
    let pode = false, motivo = '';
    const pagina = location.pathname + location.search;
    // 🔓 v84_386: erro de chave/crédito GUARDADO não bloqueia o clique — o servidor tenta de novo de verdade
    const soTrava = (j) => !!(j.sem_credito && (j.motivo || '').startsWith('sem crédito'));
    fetch('/ia/status').then(r => r.json()).then(j => { pode = !!(j.pode && j.pode.roteiros) || soTrava(j); motivo = j.motivo || 'o recurso “Roteiros direto na IA” está desligado';
      bots.forEach(b => { b.style.display = ''; if (!pode) { b.style.opacity = '.6'; b.title = 'IA desligada: ' + motivo + ' — ligue em 🤖 IA nas buscas e modelos'; } }); }).catch(() => {});
    const el = (id) => id ? document.getElementById(id) : null;
    const statusDe = (b) => el(b.dataset.iaStatus) || b.nextElementSibling;
    const dizEm = (b, t) => { const st = statusDe(b); if (st) st.textContent = t; };
    function aplicar(b, t) {
      fetch('/tarefas/' + t.id + '/aplicada', { method: 'POST' }).catch(() => {});
      b.disabled = false;
      if (t.status !== 'pronto') { dizEm(b, '⚠ ' + (t.erro || 'a IA não respondeu')); return; }
      const resp = el(b.dataset.iaResp), ler = el(b.dataset.iaLer);
      if (!resp) { dizEm(b, '⚠ não achei o campo da resposta'); return; }
      resp.value = (t.resultado || {}).texto || ''; resp.dispatchEvent(new Event('input'));
      dizEm(b, '✅ resposta da IA colada — lendo…');
      if (ler) ler.click();
    }
    async function acompanhar(b, id) {
      b.disabled = true;
      dizEm(b, '🤖 a IA está escrevendo no servidor… pode fechar a aba: quando terminar chega um aviso no 🔔 e, voltando aqui, a resposta é colada sozinha.');
      while (true) {
        let t = null;
        try { const r = await fetch('/tarefas/' + id, { cache: 'no-store' }); if (r.status === 404) { b.disabled = false; dizEm(b, '⚠ a tarefa sumiu'); return; } t = await r.json(); } catch (_) {}
        if (t && t.status !== 'rodando') { aplicar(b, t); return; }
        await new Promise(r => setTimeout(r, 3000));
      }
    }
    bots.forEach(b => b.addEventListener('click', async () => {
      if (!pode) {  // 🔓 v84_378: confere de novo na hora do clique (o estado da abertura da página pode estar velho)
        try { const j = await (await fetch('/ia/status', { cache: 'no-store' })).json(); pode = !!(j.pode && j.pode.roteiros) || soTrava(j); motivo = j.motivo || motivo; } catch (_) {}
        if (pode) b.style.opacity = '';
      }
      if (!pode) { dizEm(b, '⚠ A IA está desligada (' + motivo + ') — ligue em 🤖 IA nas buscas e modelos (link no topo).'); return; }
      const pr = el(b.dataset.iaPrompt), ger = el(b.dataset.iaGerar);
      b.disabled = true;
      try {
        if (ger && pr) pr.value = '';  // v84_99: limpa antes — senão, com um prompt já gerado, esperava 30 s à toa
        if (ger) { dizEm(b, '📝 gerando o prompt…'); ger.click(); }
        let t = 0; while (ger && pr && !pr.value.trim() && t < 120) { await new Promise(r => setTimeout(r, 500)); t++; }
        if (!pr || !pr.value.trim()) throw new Error('não consegui gerar o prompt (veja o aviso ao lado do botão de gerar)');
        const titulo = (document.querySelector('h1') || {}).textContent || document.title;
        const r = await fetch('/ia/gerar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: pr.value, bg: true, pagina: pagina, titulo: titulo.trim().slice(0, 100),
                                 alvo: { resp: b.dataset.iaResp || '', ler: b.dataset.iaLer || '', prompt: b.dataset.iaPrompt || '' } }) });
        const d = await r.json(); if (!r.ok || !d.ok) throw new Error(d.erro || r.status);
        acompanhar(b, d.tarefa);
      } catch (e) { dizEm(b, '⚠ ' + e.message); b.disabled = false; }
    }));
    // voltou na página: retoma o que está rodando e cola o que terminou com a aba fechada
    fetch('/tarefas?tipo=ia_gerar&pendentes=1&limite=20&pagina=' + encodeURIComponent(pagina)).then(r => r.json()).then(d => {
      const feitos = new Set();
      (d.tarefas || []).forEach(t => {
        const b = [...bots].find(x => (x.dataset.iaResp || '') === ((t.alvo || {}).resp || ''));
        if (!b) return;
        if (feitos.has(b)) { if (t.status !== 'rodando') fetch('/tarefas/' + t.id + '/aplicada', { method: 'POST' }).catch(() => {}); return; }  // só a mais nova de cada botão
        feitos.add(b);
        if (t.status === 'rodando') acompanhar(b, t.id); else aplicar(b, t);
      });
    }).catch(() => {});
  })();
  </script>
<script>
/* 🎧 v84_399: em QUALQUER vídeo/áudio do site (≥ 15 s, com controles) aparece o atalho pro Sound design — vale pra todas
   as ferramentas que geram áudio, sem cada página precisar saber onde o arquivo fica. */
(function () {
  if (location.pathname.indexOf('/sound-design') === 0) return;
  function marcar(el) {
    if (el.dataset.sdChip || !el.controls || el.closest('.sdp')) return;
    const src = el.currentSrc || el.src || (el.querySelector('source') || {}).src || '';
    if (!src || src.indexOf('blob:') === 0 || src.indexOf('data:') === 0) return;
    let u; try { u = new URL(src, location.href); } catch (_) { return; }
    if (u.origin !== location.origin) return;
    const por = () => {
      if (el.dataset.sdChip || !(el.duration >= 15)) return;
      el.dataset.sdChip = '1';
      const a = document.createElement('a');
      a.href = '/sound-design?url=' + encodeURIComponent(u.pathname + u.search);
      a.textContent = '🎧 Sound design'; a.title = 'Ambiente, música por emoção, acentos e mixagem neste arquivo (gera uma cópia)';
      a.style.cssText = 'display:inline-block;margin:4px 6px;font-size:.8rem;padding:2px 8px;border-radius:10px;background:#ede9fe;color:#5b21b6;text-decoration:none;vertical-align:middle';
      el.insertAdjacentElement('afterend', a);
    };
    if (el.readyState >= 1) por(); else el.addEventListener('loadedmetadata', por, {once: true});
  }
  function varrer() { document.querySelectorAll('video[controls],audio[controls]').forEach(marcar); }
  let t = null;
  new MutationObserver(() => { clearTimeout(t); t = setTimeout(varrer, 400); }).observe(document.documentElement, {childList: true, subtree: true});
  document.addEventListener('DOMContentLoaded', varrer); varrer();
})();
</script>
