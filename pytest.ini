[pytest]
# A pasta toolkit/ é o toolkit completo dos 5 provedores, com sua
# própria suíte de testes (rodada como "cd pexels && python test_parsing.py",
# não via pytest recursivo — os imports relativos deles não resolvem no
# estilo de coleta do pytest a partir daqui). Já testados exaustivamente
# em separado; aqui só testamos o site (app.py + as 3 peças do pipeline).
norecursedirs = toolkit .git __pycache__ jobs outputs uploads niche_miner analises_canal

testpaths = .
python_files = test_*.py
